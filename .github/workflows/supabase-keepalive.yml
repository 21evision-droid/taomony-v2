name: Supabase Keepalive

on:
  schedule:
    # Run every 2 days — under Supabase's 7-day threshold, with margin
    - cron: '0 12 */2 * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive Edge Function
        run: |
          # The function itself writes a heartbeat row to raw_fragments.
          # No auth needed (verify_jwt=false) — zero secrets required.
          curl -sf --max-time 60 \
            "https://jiwsgaegoudcutdnqydf.supabase.co/functions/v1/keepalive"
          echo ""
          echo "Keepalive complete"
